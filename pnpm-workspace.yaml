nodeLinker: hoisted

allowBuilds:
  browser-tabs-lock: set this to true or false
  bufferutil: set this to true or false
  core-js: set this to true or false
  dtrace-provider: true
  esbuild: true
  unrs-resolver: false
  utf-8-validate: set this to true or false

minimumReleaseAgeExclude:
  - '@expo/eas-build-job@21.1.0'
  - '@expo/eas-json@21.1.0'
  - '@expo/steps@21.1.0'
  - eas-cli@21.1.0
